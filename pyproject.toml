[project]
name = "peditor"
version = "0.0.1"
description = "離線 PDF 文字編輯器（Offline PDF text editor）"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.13,<3.14"
# 版本下限為 P0 實測版本；實際鎖定版本以 uv.lock 為準（見 reports/P0/report.md）
dependencies = [
    "pymupdf>=1.26",          # AGPL-3.0（ADR-0002）
    "pikepdf>=9",             # MPL-2.0
    "PySide6-Essentials>=6.8", # LGPL-3.0，動態連結（ADR-0002）
]

[project.scripts]
peditor = "peditor.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "jsonschema>=4.23",
    "reportlab>=4.2",
    "pypdfium2>=4.30",
    "fonttools>=4.50",
]
build = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# 供應鏈冷卻期：只解析此日期前發佈的版本；升級需走 ADR（見 CLAUDE.md）
exclude-newer = "2026-09-28T00:00:00Z"
# ADR-0014：Pillow 13.0.0 安全修補（Dependabot 9 項）的冷卻期例外，只限此套件
exclude-newer-package = { pillow = "2026-10-17T00:00:00Z" }
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".claude"]  # 逐字複製的第三方技能（.claude/skills/THIRD_PARTY.md），不改寫

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # 測試中允許 assert

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607"]
"scripts/**" = ["S603", "S607"]
"packaging/**" = ["S603", "S607"]
