# G0 證據：Windows x64 與 macOS arm64 的測試與 smoke build（ADR-0003）。
# repo 已公開，GitHub 標準 runner 免費。
# 第三方 action 一律以 commit SHA 鎖定。
name: ci

on:
  push:
    branches: [main, "claude/**", "p[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --all-groups
      - name: Fonts cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tests/fixtures/fonts/*.otf
            tests/fixtures/fonts/*.ttf
          key: fonts-${{ hashFiles('tests/fixtures/fonts/fonts.json') }}
      - name: Fetch fixture fonts (pinned commit + SHA-256)
        run: uv run python scripts/fetch_fonts.py
      # 與人工實機驗證同一支腳本（manual-steps §3、§8），差別只在不開視窗
      - name: P0 check script (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts\p0_windows_check.ps1 -SkipLaunch
      - name: P0 check script (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/p0_macos_check.sh --skip-launch
      # 檢查腳本只印每步最後 5 行；失敗時印出完整 log 以便查明原因（P4 U15：Windows 偶發 0xC0000005）
      - name: Full check log (on failure)
        if: failure()
        shell: bash
        run: cat build/p0-check/log.txt || true

  # P8 發布建置（ADR-0025）：onedir＋模式 B 字型、打包結果自我檢查、Windows 安裝程式／macOS DMG。
  # 產物未簽署，只供測試（spec P8：不得標成正式部署完成）。
  release:
    name: release (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --all-groups
      - name: Fonts cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tests/fixtures/fonts/*.otf
            tests/fixtures/fonts/*.ttf
          key: fonts-${{ hashFiles('tests/fixtures/fonts/fonts.json') }}
      - name: Fetch fonts (pinned commit + SHA-256)
        run: uv run python scripts/fetch_fonts.py
      - name: Inno Setup (pinned, ADR-0025)
        if: runner.os == 'Windows'
        run: choco install innosetup --version=6.7.1 -y --no-progress --allow-downgrade
      # 同一版 PyInstaller 改由原始碼編譯 bootloader（預編譯的 bootloader 常被防毒啟發式規則誤判；ADR-0025）
      - name: PyInstaller bootloader from source (Windows, same version)
        if: runner.os == 'Windows'
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: uv pip install --reinstall --no-binary pyinstaller "pyinstaller==6.22.3"
      - name: Build release and self-check
        run: uv run --no-sync python packaging/build_release.py
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peditor-${{ runner.os }}
          path: |
            build/release/*.exe
            build/release/*.dmg
            build/release/SHA256SUMS.txt
            build/release/release.json
          if-no-files-found: error
          retention-days: 30
